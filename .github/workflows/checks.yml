name: Checks

# Required check: `checks`, a gate over the jobs below. No job has a secret; the model review runs with a stubbed
# model call here, the real one only in code-quality.yml when someone dispatches it.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image digest is bumped by hand: Dependabot does not read `run:` lines.
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          inputs: .github
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Install pinned tools
        run: |
          pip install --no-deps -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix analyzer/tools
      - name: Size check (raw runs stay out of git)
        run: python analyzer/check_size.py
      - name: Tests
        run: python -m pytest -q
      # Both fixture runs through the sandbox, a stubbed review, the human sheet and the report.
      - name: Sample runs
        run: |
          set -eu
          mkdir out
          for r in with-setup__1 baseline__1; do
            python analyzer/analyze.py run "tests/fixtures/runs/$r" --out "out/$r.json" \
              --pristine-spec tests/fixtures/SPEC.md --sandbox container
            python analyzer/review.py "tests/fixtures/runs/$r" --stub --static "out/$r.json" \
              --spec tests/fixtures/SPEC.md --out "out/$r.review.json"
          done
          python analyzer/analyze.py sheet out/with-setup__1.json out/baseline__1.json --out out/human.csv
          python analyzer/analyze.py report out/*.json --md out/report.md > /dev/null
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

  checks:
    if: ${{ always() }}
    needs: [checks-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "::error::a needed job ended as $r"; exit 1; fi
          done
