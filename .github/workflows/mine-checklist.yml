name: Mine common mistakes into the checklist

# Manual. Job `mine` reads public repositories and calls the model (no write permission, no repository token
# beyond reading). Job `propose` has the write permissions and no model secret: it validates the proposed
# checklist and opens a pull request, so a person reviews every item before it affects a score.
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated https://github.com/<owner>/<name> URLs
        type: string
        default: ''
      user:
        description: 'Optional: also mine this GitHub user''s public repositories'
        type: string
        default: ''
      match:
        description: Regex on repository name and description (with user)
        type: string
        default: ''
      model:
        description: Model id for the synthesis
        type: string
        default: claude-sonnet-5-5

permissions: {}

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - name: Install pinned tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix analyzer/tools
          node analyzer/tools/node_modules/@anthropic-ai/claude-code/install.cjs
      - name: Mine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPOS: ${{ inputs.repos }}
          USER_NAME: ${{ inputs.user }}
          MATCH: ${{ inputs.match }}
          MODEL: ${{ inputs.model }}
        run: |
          set -eu
          mkdir mining
          args=()
          # shellcheck disable=SC2206  # the URLs are split on purpose; mine.py accepts github.com URLs only
          [ -n "$REPOS" ] && args+=(--repo $REPOS)
          [ -n "$USER_NAME" ] && args+=(--user "$USER_NAME")
          [ -n "$MATCH" ] && args+=(--match "$MATCH")
          python analyzer/mine.py all "${args[@]}" --model "$MODEL" --workdir "$RUNNER_TEMP/mining" \
            --evidence-out mining/evidence.json | tee mining/log.txt
          { echo '## Checklist mining'; echo '```'; cat mining/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mining
          path: |
            mining/
            analyzer/config/checklist.json

  propose:
    needs: mine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mining
          path: mined
      - name: Open a pull request with the changed checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp mined/analyzer/config/checklist.json analyzer/config/checklist.json
          if git diff --quiet -- analyzer/config/checklist.json; then echo "Checklist unchanged"; exit 0; fi
          # The proposed file is checked again here, without any model or mining step in this job.
          python - <<'PY'
          import sys
          sys.path.insert(0, "analyzer")
          import checklist
          errors = checklist.validate(checklist.load())
          sys.exit("\n".join(errors) if errors else 0)
          PY
          branch="checklist/mined-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add analyzer/config/checklist.json
          git commit -m "chore(checklist): add mined items"
          # The token is passed for this one command only; it is not stored in the checkout.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$branch"
          {
            echo "Proposed by the mining workflow run $GITHUB_RUN_ID."
            echo
            echo "Review every new item: each one changes how runs are scored. Calibration values were recomputed over the mined repositories."
            echo
            echo '```'
            tail -c 20000 mined/mining/log.txt
            echo '```'
          } > body.md
          gh pr create --title "chore(checklist): add mined items" --body-file body.md
